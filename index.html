      GTM Consent Mode v2 — MED-83
      Must run BEFORE the GTM snippet (added in MED-82) so that tags fire

        ad_personalization: 'denied',
        wait_for_update: 500

      // Step 2: restore previous session consent (runs before React & GTM load)

            analytics_storage: 'granted',
            ad_storage: 'granted',

            ad_personalization: 'granted'

      } catch (e) { /* localStorage blocked (incognito strict mode) */ }
    </script>
